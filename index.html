<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuroth</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

    <div class="area-arvore">

        <section class="tela tela-1">

            <header class="navbar">

                <a href="https://www.youtube.com/@Suizeo"
                   class="suizeo-link"
                   target="_blank"
                   rel="noopener noreferrer">

                    <div class="logo-fundo">
                        <img src="assets/images/Logo.png"
                             alt="Logo Suizeo"
                             class="logo">
                    </div>

                    <span class="suizeo-nome">Suizeo</span>

                </a>

            </header>

            <a href="https://discord.gg/44FChh7uJ8"
               class="anuroth-titulo"
               target="_blank"
               rel="noopener noreferrer">
                Anuroth
            </a>

            <div class="servidor-container">

                <div class="botao-area">

                    <button class="botao-servidor"
                            id="copiar-ip">
                        JOGAR
                    </button>

                    <p class="mensagem-copiado"
                       id="mensagem-copiado">
                        IP COPIADO!
                    </p>

                </div>

                <p class="servidor-texto">
                    Construa seu próprio reino junto com seus amigos,<br>
                    explore novos mundos e viva aventuras<br>
                    inesquecíveis em Anuroth.
                </p>

            </div>

        </section>

        <section class="tela tela-2">

            <img src="assets/images/quadrados.webp"
                 class="quadrados"
                 alt="">

            <a href="https://littlebigplanet.fandom.com/wiki/LittleBigPlanet_2"
               class="clicavel-tela2 clicavel-littlebigplanet"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="LittleBigPlanet 2">
            </a>

            <a href="https://instagram.com/osuizeo"
               class="clicavel-tela2 clicavel-instagram"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Instagram do Suizeo">
            </a>

        </section>

        <img src="assets/images/arvore.webp"
             alt=""
             class="arvore-gigante">

    </div>

    <section class="tela tela-3">

        <div class="personagem-area personagem-1">

            <div class="balao">
                Não tem nada melhor que um servidor de anarquia vanilla bem feito!
            </div>

        </div>

        <div class="personagem-area personagem-2">

            <div class="balao">
                Servidor 24/7! Posso jogar quando eu quiser!
            </div>

        </div>

        <div class="personagem-area personagem-3">

            <div class="balao">
                Estou desde o primeiro servidor
            </div>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>

</html>
